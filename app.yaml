apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhacs-web-app
  namespace: rhacs-web-app
  labels:
    app: rhacs-web-app
    version: v1
    managed-by: rhacm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rhacs-web-app
  template:
    metadata:
      labels:
        app: rhacs-web-app
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rhacs-web-app
          image: nginxinc/nginx-unprivileged:1.25-alpine
          ports:
            - containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: rhacs-web-app-html
---
apiVersion: v1
kind: Service
metadata:
  name: rhacs-web-app
  namespace: rhacs-web-app
  labels:
    app: rhacs-web-app
spec:
  selector:
    app: rhacs-web-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rhacs-web-app
  namespace: rhacs-web-app
  labels:
    app: rhacs-web-app
spec:
  to:
    kind: Service
    name: rhacs-web-app
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rhacs-web-app
  namespace: rhacs-web-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rhacs-web-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhacs-web-app-html
  namespace: rhacs-web-app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>RHACS Cluster — Production Workload</title>
      <style>
        body { font-family: sans-serif; background: #0f1117; color: #e2e8f0;
               display: flex; align-items: center; justify-content: center;
               height: 100vh; margin: 0; }
        .card { background: #1a1d2e; border: 1px solid #2d3748; border-radius: 12px;
                padding: 40px 48px; text-align: center; max-width: 480px; }
        .logo { width: 56px; height: 56px; background: #cc0000; border-radius: 12px;
                margin: 0 auto 20px; display: flex; align-items: center;
                justify-content: center; font-size: 24px; }
        h1 { font-size: 22px; margin-bottom: 8px; }
        p  { color: #718096; font-size: 14px; margin-bottom: 20px; }
        .badge { display: inline-block; background: #1a2e1a; border: 1px solid #2d6a2d;
                 color: #68d391; padding: 4px 14px; border-radius: 20px; font-size: 12px; }
        .info { margin-top: 24px; text-align: left; font-size: 12px; color: #718096; }
        .info span { color: #a0aec0; }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="logo">⚡</div>
        <h1>RHACS Production Workload</h1>
        <p>Deployed via RHACM GitOps · ArgoCD ApplicationSet</p>
        <div class="badge">● Running on rhacs.acs.ocp</div>
        <div class="info">
          <div>Cluster: <span>rhacs.acs.ocp</span></div>
          <div>Managed by: <span>hub.acs.ocp (RHACM 2.15)</span></div>
          <div>Deployed from: <span>Git → ArgoCD → RHACS</span></div>
          <div>Image: <span>nginxinc/nginx-unprivileged:1.25-alpine</span></div>
        </div>
      </div>
    </body>
    </html>
 
